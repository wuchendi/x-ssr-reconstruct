packages:
  - apps/*
  - packages/*

# Every external dependency version lives here; packages reference it as "catalog:".
catalog:
  "@babel/core": ^8.1.0
  "@biomejs/biome": 2.6.7
  "@fastify/middie": ^9.3.6
  "@fastify/static": ^10.1.10
  "@platformatic/node": ^3.78.0
  "@rolldown/plugin-babel": ^0.3.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  autocannon: ^9.0.0
  babel-plugin-relay: ^21.0.1
  fastify: ^5.12.8
  graphql: ^17.1.0
  htmlparser2: ^12.0.0
  playwright: 1.65.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-relay: ^21.0.1
  relay-compiler: ^21.0.1
  relay-runtime: ^21.0.1
  turbo: ^2.11.11
  typescript: ^7.0.2
  vite: ^8.3.7
  vitest: ^5.1.0
  wattpm: ^3.78.0

allowBuilds:
  # postinstall is not needed here (pulled in transitively by Platformatic Watt).
  protobufjs: false

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - turbo@2.11.11
  - "@biomejs/biome@2.6.7"
  - "@biomejs/cli-android-arm64@2.6.7"
  - "@biomejs/cli-android-x64@2.6.7"
  - "@biomejs/cli-darwin-arm64@2.6.7"
  - "@biomejs/cli-darwin-x64@2.6.7"
  - "@biomejs/cli-linux-arm64-musl@2.6.7"
  - "@biomejs/cli-linux-arm64@2.6.7"
  - "@biomejs/cli-linux-x64-musl@2.6.7"
  - "@biomejs/cli-linux-x64@2.6.7"
  - "@biomejs/cli-win32-arm64@2.6.7"
  - "@biomejs/cli-win32-x64@2.6.7"
